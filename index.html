<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleContraS3nha! - Sala Virtual</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- Tela de Autenticação -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2>🍿 TeleContraS3nha!</h2>
            <p>Faça login para entrar na sala</p>
            <button id="login-discord-btn">
                <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord Logo">
                Entrar com Discord
            </button>
        </div>
    </div>

    <!-- Interface Principal (Oculta até fazer login) -->
    <div id="main-container" class="main-container" style="display: none;">
        <div class="cinema-area">
            <header>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1>TeleContraS3nha!</h1>
                    <button id="leave-btn" class="danger-btn">Sair da Sala</button>
                </div>
                <p>ASSISTINDO: <span id="viewer-count">0</span> | LINK: <a id="share-link" href="#">Gerar link</a></p>
                <!-- Botão oculto que só o Host vai ver quando estiver transmitindo -->
                <button id="stop-stream-btn" class="danger-btn" style="display: none; margin-top: 10px;">Parar Transmissão</button>
            </header>
            
            <div id="broadcaster-ui" style="display: none; text-align: center;">
                <select id="quality-select" style="margin-bottom: 15px; padding: 10px; border-radius: 6px; background: #2a2a2a; color: white; border: 1px solid #444; width: 100%; font-size: 1rem;">
                    <option value="720">🎥 Qualidade Padrão (720p - 30fps)</option>
                    <option value="1080">🎬 Alta Qualidade (1080p - 60fps)</option>
                </select>
                <br>
                <button id="start-btn">Começar a Compartilhar Tela</button>
            </div>

            <div class="screen-container">
                <video id="video" autoplay playsinline controls muted></video>
            </div>
        </div>

        <aside class="sidebar">
            <div class="user-list-section">
                <h2>QUEM ESTÁ NA SALA</h2>
                <ul id="user-list">
                    <!-- Usuários aparecerão aqui -->
                </ul>
            </div>
            
            <div class="chat-section">
                <h2>CHAT DA SALA</h2>
                <div id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
                    <button id="send-btn">➤</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
